name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build static linux/amd64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o qnap-led ./cmd/qnap-led

      - name: Checksum
        run: sha256sum qnap-led > qnap-led.sha256

      - name: Publish release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # A release for this tag may already exist if it was drafted from
          # the GitHub web UI (that creates the tag + release together,
          # before this job has built anything) — upload/overwrite assets
          # on it in that case instead of trying to create a duplicate.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" qnap-led qnap-led.sha256 --clobber
          else
            gh release create "$TAG" qnap-led qnap-led.sha256 \
              --title "$TAG" --generate-notes
          fi
